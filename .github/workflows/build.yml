name: Build & Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list "v1.0.*" --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.15"
          else
            CURRENT=$(echo $LATEST_TAG | sed 's/v//')
            PATCH=$(echo $CURRENT | awk -F. '{print $3}')
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="1.0.$NEXT_PATCH"
          fi

          echo "Next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tagcheck
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ShadowJar
        run: ./gradlew clean shadowJar

      - name: Find ShadowJar
        id: jar
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name "*.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Jar not found!"
            exit 1
          fi

          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Create Tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Prepare release files
        run: |
          mkdir -p release

          # JAR → root release folder
          cp "${{ steps.jar.outputs.jar }}" \
             "release/Interface Editor v${{ steps.version.outputs.version }}.jar"

          # config.properties from ROOT (as requested)
          if [ -f config.properties ]; then
            cp config.properties release/config.properties
          else
            echo "WARNING: config.properties not found in root"
          fi

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Interface Editor v${{ steps.version.outputs.version }}
          files: |
            release/Interface Editor v${{ steps.version.outputs.version }}.jar
            release/config.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}